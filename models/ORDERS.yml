semantic_models:
  - name: orders

    model: ref('orders')

    entities:
      - name: order
        type: primary
        expr: ORDER_ID

      - name: customer
        type: foreign
        expr: CUSTOMER_ID

    dimensions:
      - name: customer_id
        type: categorical
        expr: CUSTOMER_ID

    measures:
      - name: total_amount
        agg: sum
        expr: AMOUNT