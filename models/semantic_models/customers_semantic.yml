semantic_models:
  - name: customers

    model: ref('dim_customers')

    entities:
      - name: customer_id
        type: primary

    dimensions:
      - name: customer_name
        type: categorical

      - name: country
        type: categorical

      - name: signup_date
        type: time

        expr: signup_date

        type_params:
          time_granularity: day