metrics:
  - name: revenue
    label: Revenue
    type: simple
    type_params:
      measure: revenue  # references a measure defined in your semantic model

  - name: orders
    label: Orders
    type: simple
    type_params:
      measure: orders   # references a measure defined in your semantic model

  - name: avg_order_value
    label: Average Order Value
    type: derived
    type_params:
      expr: revenue / orders
      metrics:
        - name: revenue
        - name: orders