# Reference this view as workspace_default__orders
label: Orders

catalog: workspace
schema: default
table_name: orders

dimensions:
  order_date: {}
  amount: {}
  status: {}

  order_id:
    format: ID
    primary_key: true

  customer_id:
    format: ID

  _entity_order:
    # Entity is defined in the 'orders' dbt semantic model (models/semantic_models.yml)
    sql: ${order_id}
    hidden: true

  _entity_customer:
    # Entity is defined in the 'orders' dbt semantic model (models/semantic_models.yml)
    sql: ${customer_id}
    hidden: true

measures:
  count:
    aggregate_type: count

  total_amount:
    # Measure is defined in the 'orders' dbt semantic model (models/semantic_models.yml)
    sql: ${amount}
    aggregate_type: sum

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: orders
  target_schema: default
  config:
    materialized: view
  code: |-
    SELECT
        ORDER_ID,
        CUSTOMER_ID,
        AMOUNT,
        ORDER_DATE
    FROM workspace.default.ORDERS
