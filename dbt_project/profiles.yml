akshat_dbt_project:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: hive_metastore        # change to your Unity Catalog name if using UC
      schema: default                # change to your schema
      host: "{{ env_var('DATABRICKS_HOST') }}"          # e.g. adb-xxxx.azuredatabricks.net
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}" # e.g. /sql/1.0/warehouses/xxxx
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 4

# ─────────────────────────────────────────────────────────────────────────────
# HOW TO SET ENV VARS (run these in your terminal before dbt run):
#
#   export DATABRICKS_HOST="adb-XXXXXXXXXXXX.XX.azuredatabricks.net"
#   export DATABRICKS_HTTP_PATH="/sql/1.0/warehouses/XXXXXXXXXXXXXXXXX"
#   export DATABRICKS_TOKEN="dapiXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
#
# OR put them directly (not recommended for production):
#   host: adb-xxxx.azuredatabricks.net
#   http_path: /sql/1.0/warehouses/xxxx
#   token: dapi_your_token_here
# ─────────────────────────────────────────────────────────────────────────────
