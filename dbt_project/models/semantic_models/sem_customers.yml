version: 2

# ═══════════════════════════════════════════════════════════════════════════════
# SEMANTIC MODEL: customers
# Source dbt model: dim_customers
# Real columns used: customer_id, customer_name, city, signup_date, is_new_customer
# ═══════════════════════════════════════════════════════════════════════════════

semantic_models:
  - name: customers
    description: "Customer dimension semantic model. One row per customer. Joins to orders via customer entity."
    model: ref('dim_customers')

    # ── ENTITIES ──────────────────────────────────────────────────────────────
    entities:
      - name: customer
        type: primary
        expr: customer_id

    # ── DIMENSIONS ────────────────────────────────────────────────────────────
    dimensions:
      - name: customer_name
        type: categorical
        description: "Full name of the customer"
        expr: customer_name

      - name: city
        type: categorical
        description: "City of the customer"
        expr: city

      - name: is_new_customer
        type: categorical
        description: "True if customer signed up in last 365 days"
        expr: is_new_customer

      - name: signup_month
        type: categorical
        description: "Month the customer signed up (yyyy-MM)"
        expr: signup_month

      - name: signup_year
        type: categorical
        description: "Year the customer signed up"
        expr: signup_year

      # Time dimension for customer signup-based metrics
      - name: signup_date
        type: time
        type_params:
          time_granularity: day
        description: "Date the customer signed up"
        expr: "cast(signup_date as timestamp)"
        label: "Customer Signup Date"

    # ── MEASURES ──────────────────────────────────────────────────────────────
    measures:
      - name: customer_count
        description: "Total number of customers"
        agg: count
        expr: customer_id
        agg_time_dimension: signup_date

      - name: new_customer_count
        description: "Customers who signed up in the last 365 days"
        agg: sum
        expr: "case when is_new_customer = true then 1 else 0 end"
        agg_time_dimension: signup_date
