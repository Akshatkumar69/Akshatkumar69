version: 2

saved_queries:

  - name: monthly_revenue
    label: "Monthly Revenue"
    description: "Total revenue and order count by month"
    query_params:
      metrics:
        - total_revenue
        - total_orders
        - average_order_value
      group_by:
        - TimeDimension('orders__ordered_at', 'month')

  - name: revenue_by_city
    label: "Revenue by City"
    description: "Revenue grouped by customer city"
    query_params:
      metrics:
        - total_revenue
        - total_orders
      group_by:
        - Dimension('orders__city')

  - name: order_status_summary
    label: "Order Status Summary"
    description: "Completed vs returned breakdown"
    query_params:
      metrics:
        - total_orders
        - completed_orders
        - returned_orders
        - return_rate
      group_by:
        - TimeDimension('orders__ordered_at', 'month')

  - name: customer_signup_trend
    label: "Customer Signup Trend"
    description: "New customers over time"
    query_params:
      metrics:
        - total_customers
        - total_new_customers
      group_by:
        - TimeDimension('customers__signup_date', 'month')
