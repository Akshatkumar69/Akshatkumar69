version: 2

# ─── SOURCE DECLARATIONS ─────────────────────────────────────────────────────
sources:
  - name: raw
    database: workspace
    schema: default
    tables:

      - name: customers
        description: "Raw customer records from workspace.default.customers"
        columns:
          - name: customer_id
            description: "Primary key (int)"
            tests:
              - unique
              - not_null
          - name: customer_name
            description: "Full name of the customer"
            tests:
              - not_null
          - name: city
            description: "City where the customer is located"
          - name: signup_date
            description: "Date the customer signed up"
            tests:
              - not_null

      - name: orders
        description: "Raw order records from workspace.default.orders"
        columns:
          - name: order_id
            description: "Primary key (int)"
            tests:
              - unique
              - not_null
          - name: customer_id
            description: "Foreign key to customers"
            tests:
              - not_null
              - relationships:
                  arguments:                          # ← FIXED: dbt 1.9+ requires arguments block
                    to: source('raw', 'customers')
                    field: customer_id
          - name: order_date
            tests:
              - not_null
          - name: amount
            tests:
              - not_null
          - name: status
            tests:
              - not_null

# ─── STAGING MODELS ──────────────────────────────────────────────────────────
models:
  - name: stg_customers
    description: "Cleaned customer records."
    columns:
      - name: customer_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: customer_name
        tests:
          - not_null
      - name: city
        tests:
          - not_null
      - name: signup_date
        tests:
          - not_null

  - name: stg_orders
    description: "Cleaned order records."
    columns:
      - name: order_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "FK to stg_customers"
        tests:
          - not_null
          - relationships:
              arguments:                              # ← FIXED: dbt 1.9+ requires arguments block
                to: ref('stg_customers')
                field: customer_id
      - name: order_date
        tests:
          - not_null
      - name: amount
        tests:
          - not_null

