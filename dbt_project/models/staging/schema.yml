version: 2

# ─── SOURCE DECLARATIONS ────────────────────────────────────────────────────
sources:
  - name: raw
    database: workspace       # ← your catalog name
    schema: default           # ← your schema name
    tables:
      - name: customers       # ← already correct ✅
      - name: orders 


# ─── STAGING MODELS ─────────────────────────────────────────────────────────
models:
  - name: stg_customers
    description: "Cleaned and renamed customer records."
    columns:
      - name: customer_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: email
        tests:
          - not_null
      - name: customer_segment
        tests:
          - accepted_values:
              values: ['consumer', 'corporate', 'home office', 'unknown']
              quote: true

  - name: stg_orders
    description: "Cleaned and renamed order records."
    columns:
      - name: order_id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "FK to stg_customers"
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_status
        tests:
          - accepted_values:
              values: ['completed', 'returned', 'pending', 'cancelled', 'shipped']
              quote: true
